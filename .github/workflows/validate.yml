{
  "name": "Validate",
  "on": {
    "push": {},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "validate-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quality": {
      "name": "Ruff and mypy",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install uv",
          "run": "docker create --name uv ghcr.io/astral-sh/uv:0.11.3\ndocker cp uv:/uv /usr/local/bin/uv\ndocker rm uv"
        },
        {
          "name": "Install development tools",
          "run": "uv sync --locked"
        },
        {
          "name": "Ruff",
          "run": "uv run --locked ruff check custom_components tests"
        },
        {
          "name": "mypy",
          "run": "uv run --locked mypy custom_components/orvibo_lan"
        }
      ]
    },
    "tests": {
      "name": "pytest with coverage",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install uv",
          "run": "docker create --name uv ghcr.io/astral-sh/uv:0.11.3\ndocker cp uv:/uv /usr/local/bin/uv\ndocker rm uv"
        },
        {
          "name": "Install test dependencies",
          "run": "uv sync --locked"
        },
        {
          "name": "Run tests",
          "run": "uv run --locked pytest --cov=custom_components.orvibo_lan --cov-report=term-missing --cov-report=xml"
        }
      ]
    },
    "package-contract": {
      "name": "Package and workflow contracts",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install uv",
          "run": "docker create --name uv ghcr.io/astral-sh/uv:0.11.3\ndocker cp uv:/uv /usr/local/bin/uv\ndocker rm uv"
        },
        {
          "name": "Run standard-library contract tests",
          "run": "uv run --locked python -m unittest discover -s tests -p 'test_package_contract.py' -v\nuv run --locked python -m unittest discover -s tests -p 'test_workflows.py' -v"
        }
      ]
    },
    "hassfest": {
      "name": "Home Assistant hassfest",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb"
        }
      ]
    },
    "actionlint": {
      "name": "GitHub Actions syntax",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "uses": "rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106"
        }
      ]
    }
  }
}
