name: ha-orvibo-local-staging

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Etc/UTC}"
    ports:
      - "127.0.0.1:${HA_STAGING_PORT:-8125}:8123"
    volumes:
      - staging-config:/config
      - ./dev/configuration.yaml:/config/configuration.yaml:ro
      - ./custom_components/orvibo_lan:/config/custom_components/orvibo_lan:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    stop_grace_period: 60s

volumes:
  staging-config:
